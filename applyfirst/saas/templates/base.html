<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ApplyFirst{% endblock %}</title>
  <style>
    :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#2563eb; --bg:#f9fafb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
           color: var(--ink); background: var(--bg); line-height: 1.5; }
    header { display:flex; align-items:center; justify-content:space-between;
             padding: 14px 20px; background:#fff; border-bottom:1px solid var(--line); }
    header .brand { font-weight: 700; letter-spacing:-0.01em; }
    header .who { color: var(--muted); font-size: 14px; }
    header form { display:inline; margin:0 0 0 14px; }
    .logout { background:none; border:1px solid var(--line); border-radius:6px;
              padding:6px 12px; cursor:pointer; color: var(--ink); font-size: 13px; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px;
            padding: 28px; }
    .gbtn { display:inline-flex; align-items:center; gap:10px; background: var(--brand);
            color:#fff; text-decoration:none; padding: 11px 18px; border-radius: 8px;
            font-weight: 600; border:none; cursor:pointer; font-size: 15px; }
    .muted { color: var(--muted); }
    label { display:block; margin: 0 0 14px; font-size: 14px; font-weight: 600; }
    input, textarea, select { width:100%; padding: 9px 11px; margin-top: 5px;
            border:1px solid var(--line); border-radius: 8px; font: inherit;
            font-weight: 400; }
    h1 { margin: 4px 0 8px; font-size: 24px; letter-spacing: -0.01em; }
    footer { max-width: 720px; margin: 0 auto; padding: 24px 20px 40px;
             color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
    footer a { color: var(--muted); }
    .legal { line-height: 1.65; }
    .legal h2 { font-size: 18px; margin: 26px 0 8px; }
    .legal h3 { font-size: 15px; margin: 18px 0 6px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand" style="text-decoration:none;color:inherit">ApplyFirst</a>
    {% if user %}
      <span class="who">
        {{ user.display_name or user.email }}
        <form method="post" action="/auth/logout">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <button class="logout" type="submit">Log out</button>
        </form>
      </span>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    © ApplyFirst · <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a>
    · <a href="mailto:omharregidor@gmail.com">omharregidor@gmail.com</a>
  </footer>
</body>
</html>
